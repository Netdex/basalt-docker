name: build

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [Dockerfile, entrypoint.py, .github/workflows/build.yml]

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - name: Follow upstream release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/jesdga95/basalt/releases/latest --jq .tag_name)
          current=$(sed -n 's/^ARG BASALT_REF=//p' Dockerfile)
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::upstream tag $latest is not vX.Y.Z"
            exit 1
          fi
          if [ "$latest" = "$current" ]; then
            exit 0
          fi
          old=${current#v}
          sed -i "s/${old//./\\.}/${latest#v}/g" Dockerfile compose.yaml README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Basalt $latest"
          git push

      - name: Resolve image tags
        id: meta
        run: |
          ref=$(sed -n 's/^ARG BASALT_REF=//p' Dockerfile)
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip a version already published
        id: exists
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.exists.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          push: true
          build-args: BASALT_REF=${{ steps.meta.outputs.ref }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
